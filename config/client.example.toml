# Infernos Caller / Agent Configuration Example

[client]
# Target Infernos Node endpoint
node_url = "http://127.0.0.1:8080"

[budget]
# Maximum session budget limit in Satoshis for multi-step agent tasks
max_budget_sats = 1000

[lightning]
# Payment method for automated L402 invoice settlement: "mock", "lnd", or "nwc"
payment_backend = "mock"
